    </g>
    <g transform="rotate(0 256 438)">
      <rect x="196" y="214" width="120" height="224" rx="15" fill="#46414b" stroke="#15120f" stroke-width="5"/>
      <circle cx="224" cy="256" r="14" fill="#b9b2c0" stroke="#2c2830" stroke-width="3"/>
    </g>
    <g transform="rotate(19 256 438)">
      <rect x="196" y="214" width="120" height="224" rx="15" fill="#c0523f" stroke="#15120f" stroke-width="5"/>
      <circle cx="224" cy="256" r="14" fill="#e9a596" stroke="#8f3a2c" stroke-width="3"/>
