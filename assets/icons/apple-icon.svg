<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project Brew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2421"/>
      <stop offset="1" stop-color="#15120f"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c89172" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c89172" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Apple applies its own rounded mask, so the background is full-bleed (no transparency) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Card fan, lightly recentred to sit within Apple's rounding -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -282)">
    <ellipse cx="256" cy="300" rx="200" ry="170" fill="url(#glow)"/>
    <g transform="rotate(-38 256 438)">
      <rect x="196" y="214" width="120" height="224" rx="15" fill="#ece4d3" stroke="#15120f" stroke-width="5"/>
