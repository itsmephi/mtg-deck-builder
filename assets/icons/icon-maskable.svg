<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project Brew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2421"/><stop offset="1" stop-color="#15120f"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="350" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c89172" stop-opacity="0.40"/><stop offset="1" stop-color="#c89172" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inner">
      <path d="M232 124 L232 214 L139 386 Q133 400 149 400 L363 400 Q379 400 373 386 L280 214 L280 124 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background so OS masks (circle / squircle) crop the tile, not the art -->
