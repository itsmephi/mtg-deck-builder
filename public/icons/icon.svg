<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Brew Lab">
  <defs>
    <!-- Warm-stone background (surface-base palette) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2421"/>
      <stop offset="1" stop-color="#15120f"/>
    </linearGradient>
    <!-- Copper potion (brand accent a0725c) -->
    <linearGradient id="potion" x1="0" y1="288" x2="0" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c89172"/>
      <stop offset="1" stop-color="#8a5a40"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="350" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c89172" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c89172" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="flaskInner">
      <path d="M232 124 L232 214 L139 386 Q133 400 149 400 L363 400 Q379 400 373 386 L280 214 L280 124 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded-square tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#3f3a36" stroke-width="3"/>

  <!-- Warm glow behind potion -->
  <ellipse cx="256" cy="358" rx="150" ry="120" fill="url(#glow)"/>

  <!-- Potion fill, clipped to flask interior -->
  <g clip-path="url(#flaskInner)">
    <rect x="120" y="300" width="272" height="120" fill="url(#potion)"/>
    <!-- meniscus highlight -->
    <rect x="120" y="300" width="272" height="6" fill="#e0b193" opacity="0.85"/>
    <!-- rising bubbles -->
    <circle cx="226" cy="358" r="9" fill="#e6c2a6" opacity="0.85"/>
    <circle cx="285" cy="338" r="6" fill="#e6c2a6" opacity="0.75"/>
    <circle cx="250" cy="382" r="5" fill="#e6c2a6" opacity="0.7"/>
    <circle cx="300" cy="376" r="4" fill="#e6c2a6" opacity="0.6"/>
  </g>

  <!-- Flask glass outline -->
  <path d="M232 124 L232 214 L139 386 Q133 400 149 400 L363 400 Q379 400 373 386 L280 214 L280 124"
        fill="none" stroke="#e7e0d6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flask lip / rim -->
  <path d="M216 122 L296 122" stroke="#e7e0d6" stroke-width="15" stroke-linecap="round"/>

  <!-- Glass shine on the cone -->
  <path d="M214 246 L176 318" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- Magic spark above the flask -->
  <g transform="translate(330 150)">
    <path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#e7e0d6"/>
    <circle cx="0" cy="0" r="5" fill="#fff"/>
  </g>
  <circle cx="300" cy="108" r="5" fill="#c89172"/>
  <circle cx="366" cy="186" r="4" fill="#c89172"/>
</svg>
